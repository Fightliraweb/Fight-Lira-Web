<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel Camp">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Painel do Professor · Camp Fight Lira</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton.ttf);font-display:swap}
@font-face{font-family:Fira;src:url(fonts/fira.ttf);font-display:swap}
@font-face{font-family:Fira;font-weight:700;src:url(fonts/fira-b.ttf);font-display:swap}
:root{--r:#e0141f;--g:#e8b04a;--bg:#0a0a0c;--mut:#9a9a9a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:#f2f2f2;font-family:Fira,system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 90% 40% at 50% 0,rgba(224,20,31,.18),transparent 70%) var(--bg) no-repeat}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px}
.brand b{font-family:Anton;font-weight:400;font-size:19px;letter-spacing:1px}.brand b span{color:var(--r)}
.brand small{display:block;font-size:10.5px;letter-spacing:3px;color:var(--g);font-weight:700}
.back{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--g);margin:14px 0 2px;cursor:pointer;display:inline-block;padding:6px 0}
h2{font-family:Anton;font-weight:400;font-size:30px;letter-spacing:.5px;margin-top:14px;line-height:1.05}h2 span{color:var(--r)}
.sub{color:#999;font-size:14px;margin-top:4px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;margin-top:12px}
.lab{font-size:11.5px;font-weight:700;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.field{width:100%;background:rgba(0,0,0,.5);border:1.5px solid #34343a;border-radius:14px;padding:13px 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--r)}
select.field{appearance:none}
textarea.field{min-height:84px;resize:vertical;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2+.g2,.field+.field,.field+.g2,.g2+.field{margin-top:10px}
.mini{font-size:12px;color:#888;margin:8px 0 4px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;letter-spacing:1px;background:linear-gradient(180deg,#f0202b,#b30e18);box-shadow:0 8px 24px rgba(224,20,31,.3);margin-top:12px;cursor:pointer;text-align:center}
.btn.gold{background:linear-gradient(180deg,#f3c46a,#c58f2c);color:#1a1205;box-shadow:0 8px 24px rgba(232,176,74,.3)}
.btn.ghost{background:transparent;border:1.5px solid #3a3a3e;box-shadow:none}
.btn:disabled{opacity:.5}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.big2 button{border:0;border-radius:18px;padding:22px 8px;font-family:Anton;font-size:24px;letter-spacing:1px;cursor:pointer}
.bp{background:linear-gradient(180deg,#f4f4f4,#bdbdbd);color:#0a0a0c}
.bf{background:linear-gradient(180deg,#f0202b,#9e0c16);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700;border:1px solid #333;cursor:pointer}
.chip.p{background:#e9e9e9;color:#111}.chip.f{background:var(--r)}
.item{display:flex;align-items:center;gap:12px;cursor:pointer}
.item .av{width:52px;height:52px;border-radius:50%;flex:none;background:#1b1b1f center/cover;border:2px solid var(--r);display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:22px}
.item b{display:block;font-size:16px}.item span{font-size:13px;color:#999}
.item .go{margin-left:auto;color:var(--g);font-weight:700;font-size:13px;white-space:nowrap}
.fx{width:46px;height:16px;border-radius:4px;flex:none;border:1px solid #444}
.badge{background:var(--g);color:#1a1205;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px}
.tec{padding:12px 0;border-bottom:1px solid #222}
.tec:last-child{border-bottom:0}
.tec .nm{font-size:15px;font-weight:700}
.slot{display:flex;align-items:center;gap:8px;margin-top:8px}
.slot input{flex:1;min-width:0;padding:9px 11px;font-size:14px;border-radius:10px}
.nb{display:flex;gap:5px}
.nb button{width:38px;height:38px;border-radius:10px;border:1.5px solid #3a3a3e;background:#141416;font-family:Anton;font-size:18px;cursor:pointer}
.nb button.on0{background:#3a3a3e;border-color:#666}.nb button.on1{background:#7a0a12;border-color:#b30e18}
.nb button.on2{background:var(--r);border-color:#ff5a62}.nb button.on3{background:var(--g);border-color:#ffe2a3;color:#1a1205}
.obs{font-size:14.5px;line-height:1.4;padding:10px 0;border-top:1px solid #222}.obs:first-of-type{border-top:0}
.obs small{display:block;color:#888;font-size:12px}
.obs.nova{color:#fff}.obs.nova small{color:var(--g)}
.rec{display:flex;align-items:center;gap:12px;margin-top:10px}
.rbtn{width:64px;height:64px;border-radius:50%;flex:none;border:0;background:linear-gradient(180deg,#f0202b,#b30e18);box-shadow:0 0 24px rgba(224,20,31,.45);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rbtn.on{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 10px rgba(224,20,31,.2)}}
audio{width:100%;margin-top:10px}
.tog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--g)}
input[type=range]{width:100%;accent-color:var(--r);margin-top:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1c1c20;border:1px solid #3a3a3e;padding:12px 18px;border-radius:14px;font-size:14.5px;z-index:30;white-space:nowrap}
.toast.ok{border-color:rgba(232,176,74,.6)}.toast.er{border-color:var(--r)}
.err{color:#ff5a62;font-size:14.5px;margin-top:10px;min-height:18px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:1.5px solid #333;background:#121214;border-radius:30px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--r);border-color:var(--r)}
.load{text-align:center;color:#888;margin-top:60px}
.bol{width:34px;height:34px;border-radius:50%;display:inline-block;border:2px solid #4a4a50;background:#111;cursor:pointer;flex:none}
.bol.b1{background:#e0141f;border-color:#ff5a62}.bol.b2{background:linear-gradient(90deg,#e0141f 50%,#22c55e 50%);border-color:#888}.bol.b3{background:#22c55e;border-color:#7ef0a6}
.rx{display:grid;grid-template-columns:1fr 50px 50px 50px;align-items:center;gap:2px;padding:9px 0;border-bottom:1px solid #222}.rx .bol{justify-self:center}
.rx.h{padding:0 0 6px;font-size:10.5px;letter-spacing:1px;color:#888;font-weight:700;text-align:center}.rx .g{font-size:15px}.rx .g small{display:block;font-size:11px;color:#888}
</style></head>
<body>
<div class="wrap" id="v"><div class="load">Carregando...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const URLSB='https://nvwmxcgxmevvnlhvzvza.supabase.co',KEY='sb_publishable_lxgptApQpbleuj7jexhATA_Dzos_aYv',EMAIL='anjogelado16@gmail.com';
const sb=supabase.createClient(URLSB,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'camp-prof'}});
const $=s=>document.querySelector(s),V=()=>$('#v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COR={branca:'#f2f2f2',azul:'#1f6fd6',roxa:'#7b2fbf',marrom:'#7a4a2a',preta:'#111',cinza:'#8a8a8a',amarela:'#e6c200',laranja:'#e8781a',verde:'#2e9e4a'};
const hoje=()=>{const d=new Date(Date.now()-3*36e5);return d.toISOString().slice(0,10)};
const mes1=()=>hoje().slice(0,8)+'01';
const br=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
function toast(t,tipo='ok'){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast '+tipo;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function ok(p,msg='Salvo'){const r=await p;if(r&&r.error){console.error(r.error);toast('Não salvou: '+(r.error.message||'erro'),'er');throw r.error}if(msg)toast('✓ '+msg);return r}
const topo=(voltar)=>`<div class="top"><div class="brand"><img src="logo.png" alt=""><div><b>CAMP <span>FIGHT LIRA</span></b><small>PAINEL DO PROFESSOR</small></div></div>
<a href="./" class="btn ghost" style="width:auto;margin:0;padding:9px 12px;font-size:12px;text-decoration:none;color:#f2f2f2">VER APP</a></div>${voltar?`<div class="back" onclick="${voltar}">← VOLTAR</div>`:''}`;

// ===== LOGIN =====
async function iniciar(){const {data}=await sb.auth.getSession();if(data.session)return home();telaLogin()}
function telaLogin(){V().innerHTML=`<div style="text-align:center;margin-top:12vh"><img src="logo.png" style="width:96px;filter:drop-shadow(0 0 30px rgba(224,20,31,.5))">
<h2 style="font-size:38px">MODO <span>PROFESSOR</span></h2><div class="sub">Entre uma vez. Este celular fica lembrando.</div></div>
<div class="card" style="margin-top:26px"><input id="em" class="field" type="email" value="${EMAIL}" autocomplete="username">
<input id="pw" class="field" type="password" placeholder="Senha do professor" autocomplete="current-password">
<button class="btn" id="be" onclick="logar()">ENTRAR</button><div class="err" id="le"></div></div>`}
async function logar(){$('#be').textContent='ENTRANDO...';const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error){$('#le').textContent='E-mail ou senha não conferem.';$('#be').textContent='ENTRAR';return}home()}
async function sairProf(){await sb.auth.signOut();telaLogin()}

// ===== HOME =====
let SALAS=[],ALUNOS=[];
async function carregar(){const [s,a]=await Promise.all([sb.from('camp_salas').select('id,tipo,grupo,titulo,sub,ordem,conteudo').order('ordem'),sb.from('camp_alunos').select('*').order('nome')]);
 if(s.error||a.error){toast('Sem acesso. Entre de novo.','er');await sb.auth.signOut();telaLogin();throw 0}SALAS=s.data;TODOS=a.data;ALUNOS=a.data.filter(x=>x.ativo);BLOQ=a.data.filter(x=>!x.ativo)}
let TODOS=[],BLOQ=[];
async function home(){V().innerHTML=topo()+'<div class="load">Carregando...</div>';await carregar();
 const {data:obs}=await sb.from('camp_observacoes').select('id').eq('lida',false);const nObs=(obs||[]).length;
 const mt=SALAS.find(s=>s.tipo==='mt'),jj=SALAS.filter(s=>s.tipo==='jj');
 const al=sid=>ALUNOS.filter(a=>a.sala_id===sid);
 const avatar=a=>`<div class="av" style="${a&&a.foto?`background-image:url('${esc(foto(a.foto))}')`:''}">${a&&a.foto?'':esc((a?a.nome:'?')[0])}</div>`;
 V().innerHTML=topo()+`<h2>HOJE · <span>${br(hoje())}</span></h2><div class="sub">Toque no aluno para lançar presença, nota, peso, teste e recado.</div>
 ${nObs?`<div class="card item" onclick="telaObs()"><div class="av" style="border-color:var(--g)">✍</div><div><b>Observações dos alunos<span class="badge">${nObs}</span></b><span>Toque para ler</span></div><div class="go">LER ›</div></div>`:''}
 <div class="lab" style="margin-top:22px">MUAY THAI</div>
 ${mt?al(mt.id).map(a=>`<div class="card item" onclick="telaPersonal('${a.id}')">${avatar(a)}<div><b>${esc(a.nome_completo||a.nome)}</b><span>${a.aulas_mes/4}x por semana${a.camp_data?' · camp até '+br(a.camp_data):''}${a.pin_hash?'':' · ainda não criou a senha'}</span></div><div class="go">ABRIR ›</div></div>`).join(''):''}
 <button class="btn ghost" onclick="novoMT()">+ NOVO ALUNO DE MUAY THAI</button>
 ${mt?`<button class="btn ghost" onclick="telaSala('${mt.id}')">SALA MUAY THAI · senha, recado para todos, bloqueados</button>`:''}
 <button class="btn gold" onclick="telaVideosMT()">▶ VÍDEOS DO MUAY THAI</button>
 ${['JIU-JITSU ADULTO','JIU-JITSU KIDS'].map(g=>`<div class="lab" style="margin-top:22px">${g}</div>`+jj.filter(s=>s.grupo===g).map(s=>`<div class="card item" onclick="telaSala('${s.id}')"><div class="fx" style="background:${COR[s.conteudo.faixa]}"></div><div><b>${esc(s.titulo)}</b><span>${al(s.id).length} aluno${al(s.id).length===1?'':'s'}${al(s.id).length?' · '+al(s.id).map(a=>esc(a.nome)).join(', '):''}</span></div><div class="go">ABRIR ›</div></div>`).join('')).join('')}
 <button class="btn ghost" style="margin-top:30px" onclick="sairProf()">SAIR DO MODO PROFESSOR</button>`;scrollTo(0,0)}
const foto=p=>!p?'':/^https?:/.test(p)?p:p;

// ===== PRESENÇA (comum) =====
async function blocoPresenca(a){const {data}=await sb.from('camp_presencas').select('dia,status').eq('aluno_id',a.id).gte('dia',mes1()).order('dia');
 const L=data||[],p=Math.min(L.filter(x=>x.status!=='f').length,a.aulas_mes),ex=L.slice(a.aulas_mes).filter(x=>x.status==='p').length,fal=L.filter(x=>x.status==='f');
 return `<div class="card"><div class="lab">Barra do mês · ${p} de ${a.aulas_mes}${p>=a.aulas_mes?' · MÊS 100% ★':''}${ex?' · +'+ex+' extra':''}</div>
 <input type="date" id="pdia" class="field" value="${hoje()}" max="${hoje()}">
 <div class="big2" style="margin-top:10px"><button class="bp" onclick="presenca('${a.id}','p')">✓ PRESENTE</button><button class="bf" onclick="presenca('${a.id}','f')">✗ FALTOU</button></div>
 <div class="chips">${L.map(x=>`<span class="chip ${x.status}" style="${x.status==='r'?'background:var(--g);color:#1a1205':''}" onclick="tirarPresenca('${a.id}','${x.dia}')">${br(x.dia)} ${{p:'✓',f:'✗',r:'↺'}[x.status]}</span>`).join('')||'<span class="mini">Nenhuma marcação neste mês.</span>'}</div>
 ${fal.length?`<div class="mini" style="margin-top:12px">Ele repôs a falta? Toque e ela fica dourada:</div><div class="chips" style="margin-top:6px">${fal.map(x=>`<span class="chip" style="border-color:var(--g);color:var(--g)" onclick="repor('${a.id}','${x.dia}')">↺ REPÔS ${br(x.dia)}</span>`).join('')}</div>`:''}
 ${L.length?'<div class="mini">Marcou errado? Toque no dia para apagar.</div>':''}</div>`}
async function repor(id,dia){await ok(sb.from('camp_presencas').update({status:'r'}).eq('aluno_id',id).eq('dia',dia),'Falta reposta');reabrir()}
async function presenca(id,st){const dia=$('#pdia').value||hoje();await ok(sb.from('camp_presencas').upsert({aluno_id:id,dia,status:st}),st==='p'?'Presença marcada':'Falta marcada');reabrir()}
async function tirarPresenca(id,dia){if(!confirm('Apagar a marcação de '+br(dia)+'?'))return;await ok(sb.from('camp_presencas').delete().eq('aluno_id',id).eq('dia',dia),'Apagado');reabrir()}
let reabrir=()=>home();

// ===== RECADO + ÁUDIO =====
let rec=null,pedacos=[],audioBlob=null,audioTipo='';
let ALVO=null;
function blocoRecado(alvo){ALVO=alvo;return `<div class="card"><div class="lab">Novo recado ${alvo.aluno?'para '+esc(alvo.nome):'para a sala toda'}</div>
 <textarea id="rtx" class="field" placeholder="Escreva o recado da semana"></textarea>
 <div class="rec"><button class="rbtn" id="rb" onclick="gravar()"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" id="ri"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-2.1a7 7 0 006-6.9z"/></svg></button>
 <div><b id="rs">Gravar áudio</b><div class="mini" style="margin:2px 0 0">Toque para gravar e toque de novo para parar.</div></div></div>
 <div id="rp"></div>
 <input id="rlab" class="field" style="margin-top:10px" placeholder="Rótulo (ex.: Semana 2) — opcional">
 <button class="btn gold" id="renv" onclick="enviarRecado(ALVO)">ENVIAR RECADO</button></div>`}
async function gravar(){
 if(rec&&rec.state==='recording'){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  audioTipo=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  rec=new MediaRecorder(st,audioTipo?{mimeType:audioTipo}:undefined);pedacos=[];
  rec.ondataavailable=e=>e.data.size&&pedacos.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());audioBlob=new Blob(pedacos,{type:(rec.mimeType||audioTipo||'audio/mp4').split(';')[0]});
   $('#rb').classList.remove('on');$('#rs').textContent='Áudio pronto ✓';$('#rp').innerHTML=`<audio controls src="${URL.createObjectURL(audioBlob)}"></audio><div class="mini" onclick="apagarAudio()" style="cursor:pointer;color:#ff5a62">Apagar e gravar de novo</div>`};
  rec.start();$('#rb').classList.add('on');$('#rs').textContent='Gravando... toque para parar';
 }catch(e){toast('Libere o microfone para este site.','er')}}
function apagarAudio(){audioBlob=null;$('#rp').innerHTML='';$('#rs').textContent='Gravar áudio'}
async function subir(blob,pasta,ext){const nome=pasta+'/'+crypto.randomUUID()+'.'+ext;
 const r=await sb.storage.from('camp').upload(nome,blob,{contentType:blob.type,upsert:false});if(r.error){toast('Arquivo não subiu: '+r.error.message,'er');throw r.error}
 return sb.storage.from('camp').getPublicUrl(nome).data.publicUrl}
async function enviarRecado(alvo){const t=$('#rtx').value.trim();if(!t&&!audioBlob){toast('Escreva ou grave algo.','er');return}
 $('#renv').disabled=true;$('#renv').textContent='ENVIANDO...';
 try{let au=null;if(audioBlob){const ext={'audio/mp4':'m4a','audio/webm':'webm','audio/ogg':'ogg'}[audioBlob.type]||'m4a';au=await subir(audioBlob,'audio',ext)}
  await ok(sb.from('camp_recados').insert({sala_id:alvo.sala,aluno_id:alvo.aluno||null,texto:t||null,audio:au,data_label:$('#rlab').value.trim()||null}),'Recado enviado. O aluno já vê.');
  audioBlob=null;reabrir()}catch(e){$('#renv').disabled=false;$('#renv').textContent='ENVIAR RECADO'}}
async function ultimoRecado(sala,aluno){let q=sb.from('camp_recados').select('*').eq('sala_id',sala).order('created_at',{ascending:false}).limit(1);q=aluno?q.eq('aluno_id',aluno):q.is('aluno_id',null);const {data}=await q;const r=(data||[])[0];
 return r?`<div class="card"><div class="lab">Recado que o aluno está vendo</div>${r.texto?`<div style="font-size:15px;line-height:1.4">"${esc(r.texto)}"</div>`:''}${r.audio?`<audio controls src="${esc(r.audio)}"></audio>`:''}<div class="mini">${esc(r.data_label||br(r.created_at.slice(0,10)))}</div></div>`:''}

// ===== OBSERVAÇÕES =====
async function blocoObs(a){const {data}=await sb.from('camp_observacoes').select('*').eq('aluno_id',a.id).order('created_at',{ascending:false}).limit(15);
 const novas=(data||[]).filter(o=>!o.lida).map(o=>o.id);if(novas.length)sb.from('camp_observacoes').update({lida:true}).in('id',novas).then(()=>{});
 return `<div class="card"><div class="lab">O que o aluno escreveu</div>${(data||[]).map(o=>`<div class="obs ${o.lida?'':'nova'}"><small>${new Date(o.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${o.lida?'':' · NOVA'}</small>"${esc(o.texto)}"</div>`).join('')||'<div class="mini">Nada ainda.</div>'}</div>`}
async function telaObs(){reabrir=telaObs;await carregar();const {data}=await sb.from('camp_observacoes').select('*').order('created_at',{ascending:false}).limit(40);
 const nomeDe=o=>{const a=ALUNOS.find(x=>x.id===o.aluno_id);return a?(a.nome_completo||a.nome):(o.nome||'Aluno')};
 V().innerHTML=topo('home()')+`<h2>OBSERVAÇÕES <span>DOS ALUNOS</span></h2><div class="card">${(data||[]).map(o=>`<div class="obs ${o.lida?'':'nova'}"><small>${esc(nomeDe(o))} · ${new Date(o.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${o.lida?'':' · NOVA'}</small>"${esc(o.texto)}"</div>`).join('')||'<div class="mini">Nada ainda.</div>'}</div>`;
 const novas=(data||[]).filter(o=>!o.lida).map(o=>o.id);if(novas.length)sb.from('camp_observacoes').update({lida:true}).in('id',novas).then(()=>{});scrollTo(0,0)}

// ===== PERSONAL =====
let aba='hoje';
async function telaPersonal(id,ab){if(ab)aba=ab;reabrir=()=>telaPersonal(id);await carregar();const a=ALUNOS.find(x=>x.id===id);if(!a)return home();
 const abas=[['hoje','Presença'],['tecnica','Técnica'],['peso','Peso'],['teste','Teste'],['missao','Missão'],['camp','Meu camp'],['recado','Recado'],['obs','Observações'],['dados','Cadastro']];
 let h=topo('aba=\'hoje\';home()')+`<div class="card item" style="cursor:default"><div class="av" style="width:64px;height:64px;${a.foto?`background-image:url('${esc(a.foto)}')`:''}">${a.foto?'':esc(a.nome[0])}</div><div><b style="font-size:19px">${esc(a.nome_completo||a.nome)}</b><span>Muay Thai${a.dias?' · '+esc(a.dias):''}</span></div></div>
 <div class="tabs">${abas.map(([k,t])=>`<button class="${aba===k?'on':''}" onclick="telaPersonal('${a.id}','${k}')">${t}</button>`).join('')}</div>`;
 V().innerHTML=h+'<div class="load">...</div>';
 if(aba==='hoje')h+=await blocoPresenca(a);
 if(aba==='tecnica')h+=await blocoTecnica(a);
 if(aba==='peso'){const {data}=await sb.from('camp_pesagens').select('*').eq('aluno_id',a.id).order('dia',{ascending:false}).limit(10);
  h+=`<div class="card"><div class="lab">Pesagem de hoje</div><div class="g2"><input id="kg" class="field" inputmode="decimal" placeholder="Peso (kg)"><input id="kgd" type="date" class="field" value="${hoje()}"></div><button class="btn" onclick="pesar('${a.id}')">SALVAR PESO</button>
  <div class="mini" style="margin-top:14px">Meta de peso</div><div class="g2"><input id="pi" class="field" inputmode="decimal" placeholder="Peso inicial" value="${a.peso_inicio??''}"><input id="pm" class="field" inputmode="decimal" placeholder="Meta (kg)" value="${a.peso_meta??''}"></div>
  <button class="btn ghost" onclick="salvarMetaPeso('${a.id}')">SALVAR META</button>
  <div class="chips">${(data||[]).map(p=>`<span class="chip" onclick="tirarPeso('${a.id}','${p.dia}')">${br(p.dia)} · ${String(p.kg).replace('.',',')} kg</span>`).join('')}</div>${(data||[]).length?'<div class="mini">Toque numa pesagem para apagar.</div>':''}</div>
  <div class="mini">Peso só aparece para o aluno que tem meta de peso.</div>`}
 if(aba==='teste'){const {data}=await sb.from('camp_testes').select('*').eq('aluno_id',a.id).order('mes',{ascending:false}).limit(1);const t=(data||[])[0]||{};const atual=t.mes===mes1();
  h+=`<div class="card"><div class="lab">Teste do mês ${atual?'':'(novo mês)'}</div><input id="tn" class="field" placeholder="Exercício (ex.: 50 chutes)" value="${esc(t.nome||'')}">
  <div class="g2"><input id="ti" class="field" placeholder="Início do mês" value="${atual?esc(t.inicio||''):''}"><input id="tf" class="field" placeholder="Fim do mês" value="${atual?esc(t.fim||''):''}"></div>
  <select id="tm" class="field"><option value="maior" ${t.melhor!=='menor'?'selected':''}>Melhor = número MAIOR (repetições)</option><option value="menor" ${t.melhor==='menor'?'selected':''}>Melhor = número MENOR (tempo)</option></select>
  <button class="btn" onclick="salvarTeste('${a.id}')">SALVAR TESTE</button><div class="mini">Se o fim for melhor que o início, a conquista "Superou o teste" sai sozinha.</div></div>`}
 if(aba==='missao'){const m=a.missao||{};h+=`<div class="card"><div class="lab">Missão do mês</div><input id="mt" class="field" placeholder="Ex.: Pular corda 3 minutos sem parar" value="${esc(m.titulo||'')}">
  <div class="mini">Progresso: <b id="mpv">${Math.round((m.progresso||0)*100)}%</b></div><input type="range" id="mp" min="0" max="100" step="5" value="${Math.round((m.progresso||0)*100)}" oninput="$('#mpv').textContent=this.value+'%'">
  <input id="ms" class="field" style="margin-top:10px" placeholder="Status (ex.: 2 min e 10 s — faltam 50 s)" value="${esc(m.status||'')}">
 <input id="mv" class="field" style="margin-top:10px" inputmode="url" placeholder="Link do vídeo de como fazer (YouTube, opcional)" value="${esc(m.video||'')}">
  <label class="tog"><input type="checkbox" id="mc" ${m.cumprida?'checked':''}> Missão cumprida ★ (gera conquista)</label>
  <button class="btn" onclick="salvarMissao('${a.id}')">SALVAR MISSÃO</button></div>`}
 if(aba==='camp')h+=`<div class="card"><div class="lab">Meta do camp deste aluno</div><div class="mini">O que vocês combinaram</div><input id="ct" class="field" placeholder="Ex.: -4 kg e 3 rounds de manopla" value="${esc(a.camp_titulo||'')}">
  <div class="g2"><div><div class="mini">Começa em</div><input id="ci" type="date" class="field" value="${a.camp_inicio||hoje()}"></div><div><div class="mini">Dia D</div><input id="cd" type="date" class="field" value="${a.camp_data||''}"></div></div>
  <button class="btn" onclick="salvarCamp('${a.id}')">SALVAR META DO CAMP</button><div class="mini">O aluno vê a contagem regressiva no topo da Sala de Guerra.</div></div>`;
 if(aba==='recado')h+=blocoRecado({sala:a.sala_id,aluno:a.id,nome:a.nome})+await ultimoRecado(a.sala_id,a.id);
 if(aba==='obs')h+=await blocoObs(a);
 if(aba==='dados')h+=blocoCadastro(a,true);
 V().innerHTML=h;}
const num=v=>{v=String(v||'').replace(',','.').trim();return v===''?null:+v};
async function pesar(id){const k=num($('#kg').value);if(!k||k<20||k>300){toast('Peso inválido.','er');return}await ok(sb.from('camp_pesagens').upsert({aluno_id:id,dia:$('#kgd').value||hoje(),kg:k}),'Peso salvo');reabrir()}
async function tirarPeso(id,dia){if(!confirm('Apagar a pesagem de '+br(dia)+'?'))return;await ok(sb.from('camp_pesagens').delete().eq('aluno_id',id).eq('dia',dia),'Apagado');reabrir()}
async function salvarMetaPeso(id){await ok(sb.from('camp_alunos').update({peso_inicio:num($('#pi').value),peso_meta:num($('#pm').value)}).eq('id',id),'Meta de peso salva');reabrir()}
async function salvarTeste(id){const n=$('#tn').value.trim();if(!n){toast('Escreva o exercício.','er');return}
 await ok(sb.from('camp_testes').upsert({aluno_id:id,mes:mes1(),nome:n,inicio:$('#ti').value.trim()||null,fim:$('#tf').value.trim()||null,melhor:$('#tm').value}),'Teste salvo');reabrir()}
async function salvarMissao(id){const a=ALUNOS.find(x=>x.id===id),c=$('#mc').checked,old=a.missao||{};
 const m={video:$('#mv').value.trim()||null,titulo:$('#mt').value.trim(),progresso:+$('#mp').value/100,status:$('#ms').value.trim(),cumprida:c,dia:c?(old.cumprida&&old.dia?old.dia:hoje()):null};
 await ok(sb.from('camp_alunos').update({missao:m}).eq('id',id),c&&!old.cumprida?'Missão cumprida! Conquista liberada':'Missão salva');reabrir()}
async function salvarCamp(id){await ok(sb.from('camp_alunos').update({camp_titulo:$('#ct').value.trim()||null,camp_inicio:$('#ci').value||null,camp_data:$('#cd').value||null}).eq('id',id),'Meta do camp salva');reabrir()}

// ===== CADASTRO =====
function blocoCadastro(a,personal){return `<div class="card"><div class="lab">Cadastro</div>
 ${personal?`<div class="mini">Foto do aluno</div><input type="file" id="ff" accept="image/*" class="field" onchange="trocarFoto('${a.id}')">
 <input id="dn" class="field" placeholder="Nome completo" value="${esc(a.nome_completo||'')}">
 <input id="dd" class="field" placeholder="Dias e horário (ex.: Ter e Qui · 10h)" value="${esc(a.dias||'')}">`:''}
 <div class="mini">Treinos por semana (a barra do mês fica com isso × 4)</div><select id="dtw" class="field">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Math.round(a.aulas_mes/4)===n?'selected':''}>${n}x por semana · ${n*4} quadradinhos</option>`).join('')}</select>
 <button class="btn" onclick="salvarCadastro('${a.id}',${personal})">SALVAR CADASTRO</button></div>
 <div class="card"><div class="lab">Senha pessoal · ${a.pin_hash?'<span style="color:#22c55e">criada ✓</span>':'<span style="color:var(--g)">ainda não criada</span>'}</div>
 <div class="mini" style="margin-top:0">O aluno cria a própria senha no primeiro acesso. Esqueceu? Zere e ele cria de novo.</div>
 <button class="btn ghost" onclick="zerarPin('${a.id}')">ZERAR SENHA DO ALUNO</button></div>
 <button class="btn ghost" style="border-color:#5a1a1e;color:#ff7a80" onclick="desativar('${a.id}')">BLOQUEAR ALUNO</button>
 <div class="mini">Bloqueado: sai do app na hora e não entra mais. O histórico fica guardado e dá para desbloquear na página da sala.</div>`}
async function zerarPin(id){if(!confirm('Zerar a senha? O aluno vai criar uma nova no próximo acesso.'))return;const {error}=await sb.rpc('camp_prof_zerar_pin',{p_aluno:id});if(error){toast('Não zerou.','er');return}toast('✓ Senha zerada');reabrir()}
async function desbloquear(id){await ok(sb.from('camp_alunos').update({ativo:true}).eq('id',id),'Aluno desbloqueado');reabrir()}
async function salvarCadastro(id,personal){const n=+$('#dtw').value||2,u={aulas_mes:n*4,meta_presenca:n*4};
 if(personal)Object.assign(u,{nome_completo:$('#dn').value.trim()||null,dias:$('#dd').value.trim()||null});
 await ok(sb.from('camp_alunos').update(u).eq('id',id),'Cadastro salvo');reabrir()}
async function trocarFoto(id){const f=$('#ff').files[0];if(!f)return;toast('Enviando foto...');
 const img=await new Promise((s,n)=>{const i=new Image();i.onload=()=>s(i);i.onerror=n;i.src=URL.createObjectURL(f)});
 const m=1100,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(s=>c.toBlob(s,'image/jpeg',.86));const url=await subir(blob,'fotos','jpg');
 await ok(sb.from('camp_alunos').update({foto:url,foto_card:url}).eq('id',id),'Foto trocada');reabrir()}
async function trocarSenhaSala(sala){const p=$('#ds').value.trim();const {data,error}=await sb.rpc('camp_prof_senha_sala',{p_sala:sala,p_senha:p});if(error||data.erro){toast(data?data.erro:'Erro','er');return}toast('✓ Senha trocada');$('#ds').value=''}
async function trocarPin(id){const p=$('#ds').value.trim();const {data,error}=await sb.rpc('camp_prof_pin',{p_aluno:id,p_pin:p});if(error||data.erro){toast(data?data.erro:'Erro','er');return}toast('✓ Senha pessoal salva');$('#ds').value=''}
async function desativar(id){if(!confirm('Bloquear este aluno? Ele sai do app na hora e não entra mais. O histórico fica guardado.'))return;await ok(sb.from('camp_alunos').update({ativo:false}).eq('id',id),'Aluno bloqueado');aba='hoje';home()}
function novoMT(){reabrir=home;V().innerHTML=topo('home()')+`<h2>NOVO ALUNO <span>MUAY THAI</span></h2><div class="card">
 <input id="nn" class="field" placeholder="Primeiro nome" autocapitalize="words">
 <input id="nc" class="field" placeholder="Nome completo" autocapitalize="words">
 <select id="ntw" class="field">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===2?'selected':''}>${n}x por semana · ${n*4} quadradinhos</option>`).join('')}</select>
 <button class="btn" id="bn" onclick="criarMT()">CADASTRAR</button><div class="err" id="ne"></div>
 <div class="mini">O aluno entra na sala Muay Thai com a senha da sala, escolhe o nome dele e cria a própria senha.</div></div>`}
async function criarMT(){const mt=SALAS.find(s=>s.tipo==='mt'),n=$('#nn').value.trim().split(' ')[0];if(!n){$('#ne').textContent='Escreva o nome.';return}
 const nome=n.replace(/^./,c=>c.toUpperCase());if(TODOS.some(a=>a.sala_id===mt.id&&a.nome.toLowerCase()===nome.toLowerCase())){$('#ne').textContent='Já existe um '+nome+'. Use outro nome (ex.: '+nome+'H).';return}
 const tw=+$('#ntw').value;$('#bn').disabled=true;
 const {data,error}=await sb.from('camp_alunos').insert({sala_id:mt.id,nome,nome_completo:$('#nc').value.trim()||null,plano:'Muay Thai',aulas_mes:tw*4,meta_presenca:tw*4}).select().single();
 if(error){$('#bn').disabled=false;$('#ne').textContent='Não salvou.';return}toast('✓ '+nome+' cadastrado');aba='dados';telaPersonal(data.id)}

// ===== JIU-JITSU =====
async function telaSala(sid){reabrir=()=>telaSala(sid);await carregar();const s=SALAS.find(x=>x.id===sid),al=ALUNOS.filter(a=>a.sala_id===sid);
 const isMT=s.tipo==='mt',bl=BLOQ.filter(a=>a.sala_id===sid);
 V().innerHTML=topo('home()')+`<h2>${esc(s.titulo)}</h2><div class="sub">${esc(s.sub)}</div>${isMT?'':`<div style="margin-top:10px;height:14px;border-radius:4px;background:${COR[s.conteudo.faixa]};border:1px solid #444"></div>
 <button class="btn gold" onclick="telaVideos('${sid}')">▶ VÍDEOS DA FAIXA · ${Object.values(s.conteudo.videos||{}).filter(v=>v.url).length} de ${s.conteudo.materia.reduce((x,m)=>x+m.qtd,0)+s.conteudo.ciclo.length*2}</button>`}
 <div class="lab" style="margin-top:20px">Alunos</div>
 ${al.map(a=>`<div class="card item" onclick="${isMT?'telaPersonal':'telaJJ'}('${a.id}')"><div class="av" style="border-color:${isMT?'var(--r)':COR[s.conteudo.faixa]}">${esc(a.nome[0])}</div><div><b>${esc(a.nome)}</b><span>${a.pin_hash?'Senha pessoal criada ✓':'Ainda não criou a senha'}</span></div><div class="go">ABRIR ›</div></div>`).join('')||'<div class="mini">Nenhum aluno nesta sala.</div>'}
 ${isMT?`<button class="btn ghost" onclick="novoMT()">+ NOVO ALUNO DE MUAY THAI</button>`:`<div class="card"><div class="lab">Novo aluno nesta faixa</div><input id="jn" class="field" placeholder="Primeiro nome" autocapitalize="words">
 <button class="btn" onclick="novoJJ('${sid}')">CADASTRAR</button><div class="mini">Ele cria a própria senha no primeiro acesso.</div></div>`}
 ${bl.length?`<div class="lab" style="margin-top:20px">Bloqueados</div>${bl.map(a=>`<div class="card item" style="cursor:default;opacity:.75"><div class="av" style="border-color:#555">${esc(a.nome[0])}</div><div><b>${esc(a.nome)}</b><span>Não entra mais no app</span></div><div class="go" style="cursor:pointer" onclick="desbloquear('${a.id}')">DESBLOQUEAR</div></div>`).join('')}`:''}
 ${blocoRecado({sala:sid,aluno:null})}${await ultimoRecado(sid,null)}
 <div class="card"><div class="lab">Senha da sala da faixa</div><input id="ds" class="field" inputmode="numeric" maxlength="4" placeholder="Nova senha de 4 números" style="text-align:center;letter-spacing:8px;font-family:Anton;font-size:24px">
 <button class="btn ghost" onclick="trocarSenhaSala('${sid}')">TROCAR SENHA DA SALA</button><div class="mini">Atenção: todos os alunos ${isMT?'da turma':'da faixa'} vão precisar da nova senha.</div></div>`;scrollTo(0,0)}
async function novoJJ(sid){const n=$('#jn').value.trim();if(!n){toast('Escreva o nome.','er');return}
 if(TODOS.some(a=>a.sala_id===sid&&a.nome.toLowerCase()===n.toLowerCase())){toast('Já tem esse nome nesta sala.','er');return}
 const {data,error}=await sb.from('camp_alunos').insert({sala_id:sid,nome:n.split(' ')[0].replace(/^./,c=>c.toUpperCase()),plano:'Jiu-Jitsu',aulas_mes:8,meta_presenca:8}).select().single();
 if(error){toast('Não salvou.','er');return}toast('✓ '+data.nome+' cadastrado');telaSala(sid)}
async function telaJJ(id,ab){if(ab)aba=ab;else if(!['hoje','notas','recado','obs','dados'].includes(aba))aba='hoje';reabrir=()=>telaJJ(id);await carregar();
 const a=ALUNOS.find(x=>x.id===id),s=SALAS.find(x=>x.id===a.sala_id),C=s.conteudo;
 const abas=[['hoje','Presença'],['notas','Notas'],['recado','Recado'],['obs','Observações'],['dados','Cadastro']];
 let h=topo(`aba='hoje';telaSala('${s.id}')`)+`<div class="card item" style="cursor:default"><div class="av" style="width:60px;height:60px;border-color:${COR[C.faixa]}">${esc(a.nome[0])}</div><div><b style="font-size:19px">${esc(a.nome)}</b><span>${esc(s.titulo)}</span></div></div>
 <div class="tabs">${abas.map(([k,t])=>`<button class="${aba===k?'on':''}" onclick="telaJJ('${a.id}','${k}')">${t}</button>`).join('')}</div>`;
 V().innerHTML=h+'<div class="load">...</div>';
 if(aba==='hoje')h+=await blocoPresenca(a);
 if(aba==='notas'){const {data}=await sb.from('camp_notas').select('*').eq('aluno_id',a.id);const N={};(data||[]).forEach(n=>N[n.item]=n);
  const total=C.materia.reduce((x,m)=>x+m.qtd,0);let pts=0;
  const pv=(data||[]).filter(n=>!n.item.includes(':'));pts=pv.reduce((x,n)=>x+n.nota,0);
  h+=`<div class="card"><div class="lab">Prova · ${pts} de ${total*3} pontos (${Math.round(pts/(total*3)*100)}%)</div><div class="mini" style="margin:0">0 não sabe · 1 com ajuda · 2 faz sozinho · <b class="gold" style="color:var(--g)">3 aplica no rola</b>. Toque na nota: salva na hora.</div><div class="mini" style="margin:8px 0 0">A bolinha <b>LUTA</b> é separada da prova: ele encaixa no rola? Vazia → <b style="color:#ff5a62">ruim</b> → regular → <b style="color:#22c55e">bom</b>.</div></div>
  <div class="card">${C.materia.map(m=>`<div class="tec"><div class="nm">${esc(m.cat)}</div>${Array.from({length:m.qtd},(_,i)=>{const k=m.cat+'#'+(i+1),n=N[k];
   return `<div class="slot"><input class="field" placeholder="Técnica ${i+1} (opcional)" value="${esc(n?n.rotulo||'':'')}" onchange="rotulo(${esc(JSON.stringify(a.id))},${esc(JSON.stringify(k))},this.value)">
   <div class="nb">${[0,1,2,3].map(v=>`<button class="${n&&n.nota===v?'on'+v:''}" onclick="nota(${esc(JSON.stringify(a.id))},${esc(JSON.stringify(k))},${v},this)">${v}</button>`).join('')}</div></div>
   <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px;font-size:11px;letter-spacing:1.5px;color:#888;font-weight:700">LUTA ${B(a.id,'luta:'+k,(n&&n.rotulo)||m.cat,(N['luta:'+k]||{}).nota)}</div>`}).join('')}</div>`).join('')}</div>`}
 if(aba==='recado')h+=blocoRecado({sala:a.sala_id,aluno:a.id,nome:a.nome})+await ultimoRecado(a.sala_id,a.id);
 if(aba==='obs')h+=await blocoObs(a);
 if(aba==='dados')h+=blocoCadastro(a,false);
 V().innerHTML=h}
async function nota(id,item,v,el){const inp=el.closest('.slot').querySelector('input');
 await ok(sb.from('camp_notas').upsert({aluno_id:id,item,nota:v,rotulo:inp.value.trim()||null,updated_at:new Date().toISOString()}),'Nota '+v);
 el.parentNode.querySelectorAll('button').forEach((b,i)=>b.className=i===v?'on'+v:'')}
async function rotulo(id,item,val){const {data}=await sb.from('camp_notas').select('nota').eq('aluno_id',id).eq('item',item).maybeSingle();
 if(!data){toast('Dê a nota para salvar o nome da técnica.');return}await ok(sb.from('camp_notas').update({rotulo:val.trim()||null}).eq('aluno_id',id).eq('item',item),'Nome da técnica salvo')}

// ===== RAIO-X (bolinhas) =====
const LEG=`<div class="mini" style="margin:0">Toque na bolinha para trocar: vazia → <b style="color:#ff5a62">ruim</b> → regular → <b style="color:#22c55e">bom</b> → vazia. Salva na hora.</div>`;
const B=(alunoId,item,rot,n)=>`<span class="bol ${n?'b'+n:''}" data-n="${n||0}" onclick="girar(this,${esc(JSON.stringify(alunoId))},${esc(JSON.stringify(item))},${esc(JSON.stringify(rot))})"></span>`;
async function girar(el,id,item,rot){const n=((+el.dataset.n||0)+1)%4;el.dataset.n=n;el.className='bol'+(n?' b'+n:'');
 const r=n?await sb.from('camp_notas').upsert({aluno_id:id,item,nota:n,rotulo:rot,updated_at:new Date().toISOString()}):await sb.from('camp_notas').delete().eq('aluno_id',id).eq('item',item);
 if(r.error){toast('Não salvou. Confira a internet.','er');return}toast(['✓ Apagado','✓ Ruim','✓ Regular','✓ Bom'][n])}
let PROG=null;async function programa(){if(!PROG){const {data}=await sb.from('camp_programas').select('conteudo').eq('id','muaythai').single();PROG=data.conteudo}return PROG}
async function blocoTecnica(a){const P=await programa();const {data}=await sb.from('camp_notas').select('item,nota').eq('aluno_id',a.id).like('item','mt:%');const N={};(data||[]).forEach(n=>N[n.item]=n.nota);
 return `<div class="card">${LEG}</div>`+P.categorias.map(c=>`<div class="card"><div class="lab">${esc(c.nome)} · <span style="color:var(--g)">${esc(c.thai)}</span></div>
 <div class="rx h"><span style="text-align:left">Golpe</span>${P.contextos.map(([,t])=>`<span>${esc(t)}</span>`).join('')}</div>
 ${c.golpes.map(g=>`<div class="rx"><div class="g">${esc(g.nome)}${g.thai?`<small>${esc(g.thai)} · nível ${g.nivel}</small>`:`<small>nível ${g.nivel}</small>`}</div>${P.contextos.map(([x])=>B(a.id,`mt:${g.id}:${x}`,g.nome,N[`mt:${g.id}:${x}`])).join('')}</div>`).join('')}</div>`).join('')+
 `<div class="lab" style="margin-top:20px">Desempenho de luta</div><div class="card">${P.desempenho.map(d=>`<div class="lab" style="margin-top:8px">${esc(d.grupo)}</div>${d.itens.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222"><span style="font-size:15px">${esc(i.nome)}</span>${B(a.id,`mt:${i.id}:d`,i.nome,N[`mt:${i.id}:d`])}</div>`).join('')}`).join('')}</div>`}
async function telaVideosMT(){reabrir=telaVideosMT;PROG=null;const P=await programa(),VD=P.videos||{};
 V().innerHTML=topo('home()')+`<h2>VÍDEOS DO <span>MUAY THAI</span></h2><div class="sub">YouTube: grave, marque <b>Não listado</b>, toque em Compartilhar → Copiar link e cole no golpe. Vale para todos os alunos de Muay Thai.</div>`+
 P.categorias.map(c=>`<div class="lab" style="margin-top:20px">${esc(c.nome)} · ${esc(c.thai)}</div><div class="card">${c.golpes.map(g=>`<div class="tec"><div class="nm">${VD[g.id]?'<span style="color:var(--g)">▶</span> ':''}${esc(g.nome)}</div>
 <input class="field" style="margin-top:8px;font-size:14px;padding:10px 12px" placeholder="Cole aqui o link do YouTube" inputmode="url" value="${esc((VD[g.id]||{}).url||'')}" id="mv_${g.id}">
 <button class="btn ghost" style="margin-top:8px;padding:11px" onclick="salvarVideoMT('${g.id}',${esc(JSON.stringify(g.nome))},this)">SALVAR VÍDEO</button></div>`).join('')}</div>`).join('');scrollTo(0,0)}
async function salvarVideoMT(id,nome,btn){const url=$('#mv_'+id).value.trim();if(url&&!/^https?:\/\//.test(url)){toast('Isso não parece um link.','er');return}
 const {data,error}=await sb.from('camp_programas').select('conteudo').eq('id','muaythai').single();if(error){toast('Não salvou.','er');return}
 const C=data.conteudo;C.videos=C.videos||{};if(url)C.videos[id]={url,titulo:nome};else delete C.videos[id];
 await ok(sb.from('camp_programas').update({conteudo:C,updated_at:new Date().toISOString()}).eq('id','muaythai'),url?'Vídeo salvo':'Vídeo removido');PROG=C;
 btn.closest('.tec').querySelector('.nm').innerHTML=(url?'<span style="color:var(--g)">▶</span> ':'')+esc(nome)}

const ytOk=u=>/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)[\w-]{11}/.test(u);
async function telaVideos(sid){reabrir=()=>telaVideos(sid);await carregar();const s=SALAS.find(x=>x.id===sid),C=s.conteudo,VD=C.videos||{};
 const linha=(k,nome)=>{const v=VD[k]||{};return `<div class="tec"><div class="nm">${v.url?'<span style="color:var(--g)">▶</span> ':''}${esc(nome)}</div>
  <input class="field" style="margin-top:8px;font-size:14px;padding:10px 12px" placeholder="Nome da técnica (ex.: Baiana)" value="${esc(v.titulo||'')}" data-k="${esc(k)}" data-f="titulo">
  <input class="field" style="margin-top:6px;font-size:14px;padding:10px 12px" placeholder="Cole aqui o link do YouTube" inputmode="url" value="${esc(v.url||'')}" data-k="${esc(k)}" data-f="url">
  <button class="btn ghost" style="margin-top:8px;padding:11px" onclick="salvarVideo('${sid}',this)">SALVAR VÍDEO</button></div>`};
 V().innerHTML=topo(`telaSala('${sid}')`)+`<h2>VÍDEOS · <span>${esc(s.titulo.replace('Sala de Guerra ',''))}</span></h2>
 <div class="sub">YouTube: grave, marque <b>Não listado</b>, toque em Compartilhar → Copiar link e cole aqui. Vale para todos os alunos da faixa.</div>
 <div class="lab" style="margin-top:20px">Ciclo de 8 semanas</div><div class="card">${C.ciclo.map((c,i)=>linha('ciclo:'+i+':a',`Semana ${i+1} · 1ª aula · ${c.a}`)+linha('ciclo:'+i+':b',`Semana ${i+1} · 2ª aula · ${c.b}`)).join('')}</div>
 <div class="lab" style="margin-top:20px">Matéria da prova</div><div class="card">${C.materia.map(m=>Array.from({length:m.qtd},(_,i)=>linha(m.cat+'#'+(i+1),`${m.cat} · ${i+1}`)).join('')).join('')}</div>`;scrollTo(0,0)}
async function salvarVideo(sid,btn){const box=btn.closest('.tec'),k=box.querySelector('[data-f=url]').dataset.k;
 const url=box.querySelector('[data-f=url]').value.trim(),titulo=box.querySelector('[data-f=titulo]').value.trim();
 if(url&&!ytOk(url)&&!/^https?:\/\//.test(url)){toast('Isso não parece um link. Copie de novo no YouTube.','er');return}
 const {data,error}=await sb.from('camp_salas').select('conteudo').eq('id',sid).single();if(error){toast('Não salvou.','er');return}
 const C=data.conteudo;C.videos=C.videos||{};if(url)C.videos[k]={url,titulo:titulo||null};else delete C.videos[k];
 await ok(sb.from('camp_salas').update({conteudo:C}).eq('id',sid),url?'Vídeo salvo. O aluno já vê o ▶':'Vídeo removido');
 box.querySelector('.nm').innerHTML=(url?'<span style="color:var(--g)">▶</span> ':'')+esc(box.querySelector('.nm').textContent.replace(/^▶\s*/,''))}

iniciar();
