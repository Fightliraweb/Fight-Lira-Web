<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">

<title>Seminário de Jiu-Jitsu | Acervo Fight Lira</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  padding:28px 20px 24px;
  text-align:center;
  background:#0b0b0b;
  border-bottom:1px solid #242424;
}

.back{
  display:inline-block;
  margin-bottom:18px;
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.kicker{
  color:#d71920;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:8px;
}

h1{
  font-size:clamp(34px,7vw,64px);
  font-weight:900;
  line-height:.98;
}

h1 span{color:#d71920}

.subtitle{
  color:#aaa;
  margin-top:10px;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.meta{
  margin-top:14px;
  color:#777;
  font-size:12px;
}

.gallery{
  max-width:1500px;
  margin:auto;
  padding:22px 12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.gallery button{
  border:0;
  padding:0;
  background:#111;
  cursor:pointer;
  overflow:hidden;
  aspect-ratio:4/5;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.97);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox.active{display:flex}

.lightbox img{
  max-width:96vw;
  max-height:90vh;
  object-fit:contain;
}

.close,.navbtn{
  position:absolute;
  border:0;
  background:rgba(0,0,0,.35);
  color:white;
  cursor:pointer;
}

.close{
  top:14px;
  right:20px;
  font-size:42px;
}

.navbtn{
  top:50%;
  transform:translateY(-50%);
  font-size:42px;
  padding:12px 16px;
}

.prev{left:8px}
.next{right:8px}

.counter{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  color:#aaa;
}

footer{
  text-align:center;
  padding:28px;
  color:#666;
  border-top:1px solid #181818;
}

@media(max-width:1050px){
  .gallery{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:760px){
  .gallery{
    grid-template-columns:repeat(2,1fr);
    padding:8px 5px 18px;
    gap:5px;
  }
}
</style>
</head>

<body>

<header>

<a class="back" href="seminarios.html">
← VOLTAR PARA SEMINÁRIOS
</a>

<div class="kicker">
JIU-JITSU • ACERVO FIGHT LIRA
</div>

<h1>
SEMINÁRIO DE <span>JIU-JITSU</span>
</h1>

<div class="subtitle">
Registro oficial Fight Lira
</div>

<div class="meta" id="meta">
Carregando fotos...
</div>

</header>

<main class="gallery" id="gallery"></main>

<div class="loading" id="loading">
Carregando galeria...
</div>

<footer>
FIGHT LIRA • SEMINÁRIOS
</footer>

<div class="lightbox" id="lightbox">

<button class="close" id="close">×</button>

<button class="navbtn prev" id="prev">‹</button>

<img id="lightboxImg" alt="Foto ampliada">

<button class="navbtn next" id="next">›</button>

<div class="counter" id="counter"></div>

</div>

<script>

const repo = 'Fightliraweb/Fight-Lira-Web';

const commits = [
'34c58a5429e13df6b849bf3863d04c59897c6901',
'6de4314249b74c1ee3d414b187c9e3a704b249ab',
'b1cfefcd2e95dfced2c4b84a34637ac691b30762',
'ae076b0f0e3ac9ea5470d79665d7181a77489dd5',
'16b9ed0e430a37b7c2057c7e6d73e38933037360',
'e911103f7031a01c2618b6d7f04f2215fbbf3d88',
'20764f578ac76e024cb3fc537a8d79b31bf1125f',
'08905912e47f94a59356ba1ab9620cbb38d1918c',
'44305253f4576aef99fcb00f5ef93109774b4bb9',
'afb9681c20bd4d1163566e17475c759072fd176f',
'7d658e07ef4d562bd885db6497a95935addc6814',
'a2b5cc3346a2c478586668c1ccc9f29c8fc7a892',
'e3b18064f383f6fb2b621e1edc04be434da38ca6',
'48f307d3e4f5be21de30bc914aaf2f7bed893f20',
'0c4f99f8f6ab3f37a07f55c6bb5c96f28d963595',
'973e974f9ed04ce3af344150ff481dc4394f82e5',
'e3b26c43c18dc37ebeda5390e94bf4ca7751d662',
'a30c279b901e779fe676e72e066a91d826c1923f',
'69b87a1d059ef1801badc3297f117ca34c91d2af',
'6650d1e3ad70145ea27376ea9101259be9d262d9',
'd3648562b58d5ebb8ba54b42baa20dca5ea614b4',
'83ebfbcea9d2d687a950cc8b3a0922fd2b2ee09f',
'c928f3898b397b45ef15a055e2b9e22506344c53',
'148d0a7b964229d3cba144f61a9cdd350994ad4d',
'1b4f23645b0e93470d158a827458f15f229cf1ca',
'fedf57c75223fc5ff86d55d0da5d12539aa9a6c6'
];

const photos = [];

const gallery = document.getElementById('gallery');
const loading = document.getElementById('loading');
const meta = document.getElementById('meta');

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const counter = document.getElementById('counter');

let current = 0;

async function loadPhotos(){

try{

for(const commit of commits){

const response = await fetch(
`https://api.github.com/repos/${repo}/commits/${commit}`
);

if(!response.ok) continue;

const data = await response.json();

for(const file of data.files || []){

if(
file.status === 'added' &&
/\.(jpg|jpeg|png|webp)$/i.test(file.filename)
){

photos.push(file.filename);

}

}

}

const uniquePhotos = [...new Set(photos)];

photos.length = 0;
photos.push(...uniquePhotos);

meta.textContent =
`${photos.length} fotos disponíveis`;

renderGallery();

}catch(error){

loading.textContent =
'Não foi possível carregar a galeria.';

console.error(error);

}

}

function renderGallery(){

gallery.innerHTML = '';

photos.forEach((photo,index)=>{

const button = document.createElement('button');
const img = document.createElement('img');

img.src = encodeURI(photo);
img.loading = 'lazy';
img.decoding = 'async';

img.alt =
`Seminário de Jiu-Jitsu — Foto ${index + 1}`;

button.onclick =
()=> openLightbox(index);

button.appendChild(img);
gallery.appendChild(button);

});

loading.textContent =
`${photos.length} fotos • galeria completa`;

}

function openLightbox(index){

current = index;

lightboxImg.src =
encodeURI(photos[current]);

counter.textContent =
`${current + 1} / ${photos.length}`;

lightbox.classList.add('active');

document.body.style.overflow = 'hidden';

}

function closeLightbox(){

lightbox.classList.remove('active');
document.body.style.overflow = '';

}

function move(step){

current =
(current + step + photos.length) % photos.length;

lightboxImg.src =
encodeURI(photos[current]);

counter.textContent =
`${current + 1} / ${photos.length}`;

}

document.getElementById('close').onclick =
closeLightbox;

document.getElementById('prev').onclick =
()=>move(-1);

document.getElementById('next').onclick =
()=>move(1);

lightbox.onclick = event => {

if(event.target === lightbox){
closeLightbox();
}

};

document.addEventListener('keydown',event=>{

if(!lightbox.classList.contains('active')) return;

if(event.key === 'Escape') closeLightbox();
if(event.key === 'ArrowLeft') move(-1);
if(event.key === 'ArrowRight') move(1);

});

let touchStart = 0;

lightbox.addEventListener(
'touchstart',
event=>{
touchStart =
event.changedTouches[0].screenX;
},
{passive:true}
);

lightbox.addEventListener(
'touchend',
event=>{

const difference =
event.changedTouches[0].screenX - touchStart;

if(Math.abs(difference) > 45){

move(difference > 0 ? -1 : 1);

}

},
{passive:true}
);

loadPhotos();

</script>

</body>
</html>
